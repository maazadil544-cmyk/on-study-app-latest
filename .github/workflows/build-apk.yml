name: Build Android APK and Play Store Bundle (AAB)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK and Play Store AAB
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Prepare environment file (.env)
      run: |
        if [ ! -f .env ] && [ -f .env.example ]; then
          cp .env.example .env
        fi
        if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          echo "Using GEMINI_API_KEY from GitHub Secrets."
        fi

    - name: Setup Keystore for Release Signing
      run: |
        if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
          echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD || 'android' }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS || 'upload' }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD || 'android' }}" >> $GITHUB_ENV
          echo "Using production keystore from GitHub Secrets."
        else
          keytool -genkey -v -keystore my-upload-key.jks -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=ON Study,O=ONStudy,C=PK"
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
          echo "STORE_PASSWORD=android" >> $GITHUB_ENV
          echo "KEY_ALIAS=androiddebugkey" >> $GITHUB_ENV
          echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          echo "Generated automated release keystore."
        fi

    - name: Grant execute permission to Gradle wrapper
      run: chmod +x gradlew

    - name: Build Release APK
      run: ./gradlew assembleRelease --stacktrace

    - name: Build Play Store Bundle (AAB)
      run: ./gradlew bundleRelease --stacktrace

    - name: Prepare Outputs Directory
      run: |
        mkdir -p release-artifacts
        cp app/build/outputs/apk/release/*.apk release-artifacts/
        cp app/build/outputs/bundle/release/*.aab release-artifacts/
        echo "=== Release Artifacts Generated ==="
        ls -lh release-artifacts/

    - name: Upload Release APK (Direct Phone Installation)
      uses: actions/upload-artifact@v4
      with:
        name: ON-Study-Release-APK
        path: app/build/outputs/apk/release/*.apk
        if-no-files-found: error
        retention-days: 30

    - name: Upload Play Store Bundle (AAB for Play Console)
      uses: actions/upload-artifact@v4
      with:
        name: ON-Study-PlayStore-AAB
        path: app/build/outputs/bundle/release/*.aab
        if-no-files-found: error
        retention-days: 30

    - name: Upload Complete Package (Both APK and AAB)
      uses: actions/upload-artifact@v4
      with:
        name: ON-Study-Both-APK-and-AAB
        path: release-artifacts/
        if-no-files-found: error
        retention-days: 30


